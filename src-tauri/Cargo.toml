[package]
name = "quorix"
version = "0.1.0"
description = "Keyboard-first desktop database workspace for PostgreSQL, MySQL, and SQLite"
authors = ["Asif Hossain <Asif-4520@users.noreply.github.com>"]
edition = "2024"

[lib]
name = "quorix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "mysql", "any"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
urlencoding = "2"
tauri-plugin-dialog = "2.8.4"
keyring = "4.2.0"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
